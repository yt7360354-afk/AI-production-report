spring:
  application:
    name: ai-production-report
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080

# 기본값은 API 키 없이 동작하는 시연 모드(mock)입니다.
# 운영 전환: AI_REPORT_MOCK=false, AI_REPORT_API_KEY, AI_REPORT_MODEL 환경 변수 설정
ai:
  report:
    mock: ${AI_REPORT_MOCK:true}
    base-url: ${AI_REPORT_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_REPORT_API_KEY:}
    model: ${AI_REPORT_MODEL:gpt-4.1-mini}
    timeout-seconds: ${AI_REPORT_TIMEOUT_SECONDS:30}
