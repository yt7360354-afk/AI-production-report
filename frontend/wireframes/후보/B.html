<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 B · 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="b.css">
<style>
.dash { grid-template-columns: minmax(0, 1fr) clamp(320px, 21vw, 400px); }
/* 배치도 → 생산·가동률·품질 3칸 (SCR-001). 위 숫자 띠를 없애 배치도 칸이 세로로 여유를 갖게 함 */
.col { display: grid; grid-template-rows: minmax(0, 1.75fr) minmax(0, 1fr); gap: var(--sp-4); min-height: 0; min-width: 0; }

/* 배치도 (창 크기에 맞춰 칸이 늘고 줄어듦) */
.mapwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: var(--sp-3) var(--sp-4); border: 1px solid var(--line); border-radius: var(--r-md); background-color: var(--surface); background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 24px 24px; background-position: -1px -1px; }
.map { --conn: 28px; --gg: 24px; --lid: 92px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.m-head, .m-body { display: grid; grid-template-columns: minmax(80px, .75fr) var(--conn) minmax(0, 6fr) var(--conn) minmax(80px, .75fr) var(--conn) minmax(80px, .75fr); }
.m-head { color: var(--text-3); font-size: var(--fs-xs); margin-bottom: var(--sp-1); flex: none; }
.m-head > span { text-align: center; }
.m-heq, .m-line { display: grid; grid-template-columns: var(--lid) minmax(0, 1fr) minmax(0, 4fr) minmax(0, 1fr); column-gap: var(--gg); }
.m-heq span { text-align: center; }
.m-heq span:first-child { text-align: left; padding-left: var(--sp-2); }
.m-body { flex: 1; min-height: 0; position: relative; }
.m-lines { display: flex; flex-direction: column; min-height: 0; }
.m-line { flex: 1; min-height: 0; align-items: center; position: relative; }
.m-line::before { content: ''; position: absolute; left: calc(var(--conn) / -2); right: calc(var(--conn) / -2); top: 50%; border-top: 1.5px solid var(--line-3); }
.m-lid { position: relative; display: flex; flex-direction: column; padding-left: var(--sp-2); }
.m-lid b, .m-lid span { width: fit-content; background: var(--surface); }
.m-lid b { font-size: var(--fs-lg); font-weight: 700; line-height: 1.2; }
.m-lid span { color: var(--text-3); font-size: var(--fs-xs); }
.m-eqs { display: contents; }
.m-grp { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; height: calc(100% - 10px); }
.m-branch { position: relative; }
.m-branch::before { content: ''; position: absolute; left: 50%; top: calc(100% / 12); bottom: calc(100% / 12); border-left: 1.5px solid var(--line-3); }
.m-branch.half::before { top: 25%; bottom: 25%; }
.m-in, .m-out { display: flex; align-items: center; position: relative; }
.m-in .cell, .m-out .cell, .m-paint .cell { width: 100%; height: calc(100% / 6 - 10px); flex: none; }
.m-in::after, .m-out::before { content: ''; position: absolute; top: 50%; width: calc(var(--conn) / 2); border-top: 1.5px solid var(--line-3); }
.m-in::after { right: calc(var(--conn) / -2); } .m-out::before { left: calc(var(--conn) / -2); }
.m-paint { display: flex; flex-direction: column; justify-content: space-around; }
.m-paint .cell::before, .m-paint .cell::after { content: ''; position: absolute; top: 50%; width: calc(var(--conn) / 2); border-top: 1.5px solid var(--line-3); }
.m-paint .cell::before { left: calc(var(--conn) / -2 - 1px); } .m-paint .cell::after { right: calc(var(--conn) / -2 - 1px); }

/* 아래 3칸: 생산이 가장 넓고, 가동률·품질은 숫자 하나 + 그 숫자를 풀어 쓴 목록 */
.lower { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp-4); min-height: 0; }
.figs { display: flex; align-items: flex-end; gap: var(--sp-6); margin-bottom: var(--sp-3); flex: none; }
.figs .st-v.sm { font-size: var(--fs-xl); color: var(--text-2); }
.lead { display: flex; align-items: baseline; gap: var(--sp-3); flex: none; }
.lead .st-sub { font-size: var(--fs-sm); }
.parts { list-style: none; flex: 1; min-height: 0; margin: var(--sp-4) 0 0; padding: var(--sp-2) 0 0; display: flex; flex-direction: column; justify-content: space-around; gap: var(--sp-2); border-top: 1px solid var(--line); }
.parts li { display: grid; grid-template-columns: 72px minmax(0, 1fr) 44px; align-items: center; gap: var(--sp-3); color: var(--text-2); font-size: var(--fs-sm); }
.parts li b { text-align: right; font-size: var(--fs-md); font-weight: 600; color: var(--text); }
.parts .t { height: 6px; background: var(--surface-3); border-radius: 2px; }
.parts .t i { display: block; height: 100%; background: var(--text-2); border-radius: 2px; }
.rank { list-style: none; margin: auto 0 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-3); }
@media (max-height: 860px) {
  .col { grid-template-rows: minmax(0, 2fr) minmax(0, 1fr); }
  .st-v { font-size: var(--fs-2xl); }
  .parts { gap: var(--sp-1); margin-top: var(--sp-3); }
  .lead .st-sub { white-space: nowrap; }
}
.rank li { display: grid; grid-template-columns: 72px minmax(0, 1fr) 36px; align-items: center; gap: var(--sp-3); color: var(--text-2); font-size: var(--fs-sm); }
.rank li b { text-align: right; font-size: var(--fs-md); font-weight: 600; color: var(--text); }
.rank .t { height: 8px; background: var(--surface-3); border-radius: 2px; }
.rank .t i { display: block; height: 100%; background: var(--text-2); border-radius: 2px; }
.rank li:first-child .t i { background: var(--text); }

/* 알림 열 */
.alerts { padding: 0; }
.alerts .ph { padding: var(--sp-5) var(--sp-5) 0; }
.toast { position: fixed; right: 40px; bottom: 40px; width: 348px; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 14px var(--sp-4); background: var(--text); color: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); }
.toast b { font-weight: 600; display: flex; align-items: center; gap: var(--sp-2); }
.toast .code { color: inherit; }
.toast p { margin: var(--sp-1) 0 0; color: var(--on-dark-2); font-size: var(--fs-sm); }
.toast a { height: 32px; padding: 0 14px; display: grid; place-items: center; border-radius: var(--r-md); background: var(--surface); color: var(--text); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<header class="top"></header>

<main class="page dash">
  <div class="col">
    <section class="panel">
      <div class="ph"><h2>공장 배치도</h2><span class="meta">설비 39대</span>
        <div class="r">
          <div class="legend"><span><i class="s-R">R</i>가동<b>34</b></span><span><i class="s-S">S</i>정지<b>1</b></span><span><i class="s-I">I</i>대기<b>2</b></span><span><i class="s-D">D</i>고장<b>1</b></span><span><i class="lg-warn"></i>주의<b>1</b></span><span><i class="lg-danger"></i>위험<b>1</b></span></div>
          <div class="seg"><button class="on">2D</button><button>3D</button></div>
        </div>
      </div>
      <div class="mapwrap"><div class="map" id="map"></div></div>
    </section>

    <div class="lower">
      <section class="panel" id="prodPanel" style="cursor:pointer">
        <div class="ph"><h2>오늘 생산</h2><span class="meta">실적 = 출고 양품</span>
          <div class="r chleg"><span><i></i>실적</span><span><i class="t"></i>목표</span></div></div>
        <div class="figs">
          <div><div class="st-l">실적</div><div class="st-v" id="pDone"></div></div>
          <div><div class="st-l">목표</div><div class="st-v sm" id="pTarget"></div></div>
          <div><div class="st-l">달성률</div><div class="st-v sm" id="pRate"></div></div>
        </div>
        <div class="fill" id="chart"></div>
      </section>
      <section class="panel">
        <div class="ph"><h2>종합 가동률</h2><span class="meta">오늘 · OEE</span></div>
        <div class="lead"><div class="st-v" id="oee"></div></div>
        <ul class="parts" id="oeeParts"></ul>
      </section>
      <section class="panel">
        <div class="ph"><h2>품질</h2><span class="meta">오늘 · 출고 불량률</span></div>
        <div class="lead"><div class="st-v" id="qRate"></div><div class="st-sub" id="qSub"></div></div>
        <ul class="parts" id="rank"></ul>
      </section>
    </div>
  </div>

  <section class="panel alerts">
    <div class="ph"><h2>알림</h2><span class="meta">오늘 9건 · 진행 중 5</span></div>
    <ul id="alerts"></ul>
  </section>
</main>

<div class="toast" role="status">
  <div><b><span class="code s-D">D</span>L2 프레스 3단 · 장비고장(알람)</b><p>압력 상한 초과 · 14:20:12</p></div>
  <a href="B-press.html">보기</a>
</div>

<script src="data.js"></script>
<script src="b.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
  renderTop('대시보드')
  renderMap(map); renderAlerts(alerts)
  // 데모 연결: 라인 줄 → 라인 상세(L2 시안), 입고·도장·비전 칸 → 각 상세, 알림 → 프레스 상세, 오늘 생산 → 생산 조회
  const go = (sel, href) => document.querySelectorAll(sel).forEach((el) => el.addEventListener('click', (e) => { if (!e.target.closest('a')) location.href = href }))
  go('.m-line', 'B-line.html'); go('.m-in .cell', 'B-inbound.html'); go('.m-paint .cell', 'B-paint.html'); go('.m-out .cell', 'B-out.html'); go('.al', 'B-press.html'); go('#prodPanel', 'B-prod.html')
  document.querySelectorAll('.m-line').forEach((el) => el.style.cursor = 'pointer')
  pTarget.textContent = fmt(PROD.target); pDone.textContent = fmt(PROD.done); pRate.innerHTML = `${PROD.rate}<small>%</small>`
  oee.innerHTML = `${OEE.oee}<small>%</small>`
  // OEE = 시간 × 성능 × 양품. 세 요소를 0~100% 막대로 풀어 씀
  oeeParts.innerHTML = [['시간가동률', OEE.a], ['성능가동률', OEE.p], ['양품률', OEE.q]].map(([n, v]) => `<li><span>${n}</span><div class="t"><i style="width:${v}%"></i></div><b>${v.toFixed(1)}</b></li>`).join('')
  qRate.innerHTML = `${QUALITY.rate}<small>%</small>`; qSub.innerHTML = `양품 ${fmt(QUALITY.ok)} · 불량 ${QUALITY.ng}`
  // 공정별 불량 수 (공정 검사)
  const max = Math.max(...QUALITY.byProc.map((p) => p[1]))
  rank.innerHTML = [...QUALITY.byProc].sort((a, b) => b[1] - a[1]).map(([p, n]) => `<li><span>${p}</span><div class="t"><i style="width:${(n / max) * 100}%"></i></div><b>${n}</b></li>`).join('')
  draw(chart, prodChart)
  lucide.createIcons()
</script>
</body>
</html>
