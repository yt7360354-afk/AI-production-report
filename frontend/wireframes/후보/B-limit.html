<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 B · 관리값 기준 설정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="b.css">
<link rel="stylesheet" href="b-set.css">
<style>
.body { grid-template-columns: minmax(0, 1100px); }
.types { display: flex; align-items: center; gap: var(--sp-4); margin-bottom: var(--sp-4); }
.types .seg button { height: 36px; padding: 0 14px; font-size: var(--fs-md); }
.types .seg button span { color: inherit; opacity: .7; margin-left: 4px; font-size: var(--fs-sm); }
.tbl td { vertical-align: middle; }
.tbl td.lim { width: 180px; }
.tbl .input { height: 36px; width: 100%; text-align: right; font-variant-numeric: tabular-nums; }
.tbl .input.err { border-color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
.tbl tr.errrow td { border-bottom: 0; }
.tbl tr.errmsg td { padding-top: 0; color: var(--danger); font-size: var(--fs-sm); font-weight: 500; }
.tbl .mod { color: var(--text-2); } .tbl .mod small { display: block; color: var(--text-3); font-size: var(--fs-xs); }
.foot { display: flex; align-items: center; gap: var(--sp-4); margin-top: var(--sp-4); }
.foot .note2 { margin-right: auto; font-size: var(--fs-sm); }
</style>
</head>
<body>
<header class="top"></header>

<main class="page set">
  <div class="head">
    <h1>설정</h1>
    <div class="tabs"><a href="B-target.html">생산 목표</a><a class="on" href="#">관리값 기준</a></div>
  </div>

  <div class="body">
    <section class="panel">
      <div class="types">
        <div class="seg"><button>슬리터<span>6대</span></button><button class="on">프레스<span>24대</span></button><button>용접로봇<span>6대</span></button><button>도장라인<span>2대</span></button></div>
        <span class="note2">같은 종류의 설비 모두에 같은 기준이 적용됨</span>
      </div>
      <table class="tbl">
        <thead><tr><th>항목</th><th>단위</th><th>하한</th><th>상한</th><th>마지막 수정</th></tr></thead>
        <tbody>
          <tr><td>Pressure 1</td><td>-</td><td class="lim"><input class="input" value="200" aria-label="Pressure 1 하한"></td><td class="lim"><input class="input" value="350" aria-label="Pressure 1 상한"></td><td class="mod">기본값<small>데이터셋 설명서</small></td></tr>
          <tr><td>Pressure 2</td><td>-</td><td class="lim"><input class="input" value="200" aria-label="Pressure 2 하한"></td><td class="lim"><input class="input" value="350" aria-label="Pressure 2 상한"></td><td class="mod">기본값<small>데이터셋 설명서</small></td></tr>
          <tr><td>Pressure 5 (합계)</td><td>-</td><td class="lim"><input class="input" value="400" aria-label="Pressure 5 하한"></td><td class="lim"><input class="input" value="700" aria-label="Pressure 5 상한"></td><td class="mod">2026-11-10 09:12<small>김현수</small></td></tr>
          <tr class="errrow"><td>Press time</td><td>ms</td><td class="lim"><input class="input err" value="2,100" aria-label="Press time 하한" aria-invalid="true" aria-describedby="e1"></td><td class="lim"><input class="input" value="2,000" aria-label="Press time 상한"></td><td class="mod">기본값<small>데이터셋 설명서</small></td></tr>
          <tr class="errmsg"><td></td><td></td><td colspan="3" id="e1">하한이 상한보다 큽니다. 저장되지 않았습니다</td></tr>
        </tbody>
      </table>
      <div class="foot">
        <span class="note2">저장하면 상태 판정(상·하한 이탈 → D)과 예지보전 위험도에 바로 반영됩니다</span>
        <button class="btn primary">저장</button>
      </div>
    </section>
  </div>
</main>

<script src="data.js"></script>
<script src="b.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>renderTop('설정'); lucide.createIcons()</script>
</body>
</html>
