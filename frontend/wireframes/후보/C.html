<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>후보 C · 라인 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
.c-in { display: contents; }
/* 후보 C — 라인 보드: 공장을 위→아래 행으로. 한 행 = 한 구역(입고·L1~L6·도장·출고), 행 끝에 그 라인 숫자 */
:root {
  --bg: #f4f5f6; --surface: #ffffff; --surface-2: #f7f8f9; --surface-3: #eceef0;
  --line: rgba(22,26,32,.08); --line-2: rgba(22,26,32,.16);
  --text: #15181c; --text-2: #4d545d; --text-3: #656c76;
  --accent: #1f5fd1;
  --r-bg: #e2f2e8; --r-tx: #15623a; --r-bar: #2f8a57;
  --s-bg: #e9ebee; --s-tx: #464c55; --s-bar: #8a9099;
  --i-bg: #f2c230; --i-tx: #1e1800; --i-bar: #d9a900;
  --d-bg: #c73030; --d-tx: #ffffff; --d-bar: #c73030;
  --warn: #c99700; --danger: #c73030;
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px;
  --font: 'Pretendard', 'Malgun Gothic', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
body { background: var(--bg); color: var(--text); font: 400 14px/1.45 var(--font); font-variant-numeric: tabular-nums; display: grid; grid-template-columns: 72px 1fr; }
button { font: inherit; color: inherit; }

/* 아이콘 레일 */
.rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 4px; }
.rail .logo { width: 36px; height: 36px; border-radius: var(--r-md); background: var(--text); color: var(--surface); display: grid; place-items: center; font-weight: 600; font-size: 13px; margin-bottom: 16px; }
.rail a { width: 56px; padding: 8px 0 6px; border-radius: var(--r-md); display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-2); text-decoration: none; font-size: 11px; }
.rail a svg { width: 20px; height: 20px; stroke-width: 1.5; }
.rail a.on { background: var(--surface-3); color: var(--text); }
.rail .me { margin-top: auto; }

.main { display: grid; grid-template-rows: 56px 1fr; min-width: 0; }
.top { display: flex; align-items: center; gap: 16px; padding: 0 24px; }
.top h1 { margin: 0; font-size: 20px; font-weight: 600; }
.top .sum { display: flex; gap: 16px; margin-left: 16px; color: var(--text-2); }
.top .sum b { font-weight: 600; color: var(--text); margin-left: 4px; }
.top .r { margin-left: auto; display: flex; align-items: center; gap: 16px; color: var(--text-2); }
.top .r b { color: var(--text); font-weight: 600; font-size: 16px; margin-left: 6px; }
.bell { border: 0; background: none; position: relative; display: grid; place-items: center; width: 36px; height: 36px; color: var(--text-2); }
.bell svg { width: 20px; height: 20px; stroke-width: 1.5; }
.bell span { position: absolute; top: 2px; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--d-bg); color: var(--d-tx); font-size: 11px; line-height: 16px; text-align: center; }

.content { display: grid; grid-template-columns: 1fr 392px; gap: 16px; padding: 0 24px 24px; min-height: 0; }
.col { display: grid; grid-template-rows: auto 1fr; gap: 16px; min-height: 0; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; min-height: 0; min-width: 0; }
.ph { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.ph h2 { margin: 0; font-size: 15px; font-weight: 600; }
.ph .meta { color: var(--text-3); font-size: 13px; }
.ph .r { margin-left: auto; display: flex; gap: 16px; align-items: center; }
.seg { display: inline-flex; padding: 2px; border-radius: var(--r-md); background: var(--surface-3); }
.seg button { border: 0; background: none; height: 28px; padding: 0 12px; border-radius: 6px; color: var(--text-2); font-size: 13px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

/* 보드 */
.board { padding: 8px 20px 12px; }
.b-row { display: grid; grid-template-columns: 96px 88px minmax(0, 1fr) 200px 80px 64px; align-items: center; gap: 0 20px; height: 60px; border-top: 1px solid var(--line); cursor: pointer; }
.b-row.head { height: 36px; border-top: 0; color: var(--text-3); font-size: 12px; cursor: default; }
.b-row.shared { background: var(--surface-2); margin: 0 -20px; padding: 0 20px; }
.b-row:not(.head):not(.shared):hover { background: var(--surface-2); }
.b-zone b { font-size: 18px; font-weight: 600; }
.b-zone span { display: block; color: var(--text-3); font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r-sm); font-size: 13px; font-weight: 500; }
.chip b { font-weight: 700; }
.flow { display: flex; align-items: center; gap: 6px; }
.flow .arr { color: var(--text-3); width: 16px; height: 16px; flex: none; }
.flow .cell { width: 100px; }
.flow .txt { color: var(--text-2); }
.flow .txt b { color: var(--text); font-weight: 600; font-size: 16px; margin: 0 2px; }
.cell { position: relative; height: 40px; padding: 0 10px; border-radius: var(--r-sm); display: flex; align-items: center; gap: 8px; }
.c-top { display: contents; }
.c-name { font-size: 13px; }
.c-pdm { position: absolute; top: -9px; right: 6px; font-size: 11px; line-height: 16px; padding: 0 5px; border-radius: 4px; background: var(--surface); font-weight: 500; }
.pdm-warn .c-pdm { color: #7a5c00; box-shadow: inset 0 0 0 1px var(--warn); }
.pdm-danger .c-pdm { color: var(--danger); box-shadow: inset 0 0 0 1px var(--danger); }
.c-row { margin-left: auto; display: flex; align-items: baseline; gap: 6px; }
.c-code { font-weight: 700; font-size: 15px; }
.c-word { display: none; }
.c-dur { font-size: 12px; font-weight: 500; }
.s-R { background: var(--r-bg); color: var(--r-tx); }
.s-S { background: var(--s-bg); color: var(--s-tx); }
.s-I { background: var(--i-bg); color: var(--i-tx); }
.s-D { background: var(--d-bg); color: var(--d-tx); }
.pdm-warn { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--warn); }
.pdm-danger { outline: 2px dashed var(--danger); outline-offset: 2px; }
.prog .h { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
.prog .h b { color: var(--text); font-weight: 600; font-size: 15px; }
.prog .t { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.prog .t i { display: block; height: 100%; background: var(--text-2); border-radius: 3px; }
.n { font-size: 16px; font-weight: 500; text-align: right; }
.n small { color: var(--text-3); font-size: 12px; margin-left: 1px; }
.b-row.head .n { font-size: 12px; font-weight: 400; }

/* 아래 */
.lower { display: grid; grid-template-columns: 1.7fr 1fr 1fr; gap: 16px; min-height: 0; }
.lower .panel { display: flex; flex-direction: column; }
.figs { display: flex; gap: 28px; align-items: baseline; }
.fig .l { color: var(--text-2); font-size: 13px; }
.fig .v { font-size: 28px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; }
.fig .v small { font-size: 15px; color: var(--text-2); font-weight: 500; margin-left: 2px; }
.fig.big .v { font-size: 40px; }
.chart { flex: 1; min-height: 0; margin-top: 8px; }
.ch-grid { stroke: var(--line); } .ch-lab { fill: var(--text-3); font-size: 11px; }
.ch-target { stroke: var(--text-3); stroke-dasharray: 4 4; }
.ch-actual { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
.ch-dot { fill: var(--accent); } .ch-now { stroke: var(--line-2); }
.mini { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.mini div { display: flex; justify-content: space-between; color: var(--text-2); font-size: 13px; border-top: 1px solid var(--line); padding-top: 8px; }
.mini b { color: var(--text); font-weight: 600; }
.mini.three { grid-template-columns: 1fr; }

/* 알림 */
.alerts { display: flex; flex-direction: column; }
.alerts ul { list-style: none; margin: 0 -12px; padding: 0; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
.al { display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; padding: 12px 12px 12px 0; border-radius: var(--r-md); background: var(--surface-2); overflow: hidden; }
.al-code { align-self: stretch; margin: -12px 0; font-size: 0; }
.al-code.pdm { background: repeating-linear-gradient(180deg, var(--danger) 0 6px, transparent 6px 10px); }
.al.off { background: none; }
.al.off .al-code { background: var(--surface-3); }
.al.off .al-eq, .al.off .al-msg { color: var(--text-3); }
.al-eq { font-weight: 600; }
.al-msg { color: var(--text-2); font-size: 13px; }
.al-meta { display: flex; flex-direction: column; align-items: flex-end; color: var(--text-3); font-size: 12px; }
.al.on .al-dur { color: var(--text); font-size: 15px; font-weight: 600; }
.al-btn { margin-top: 8px; height: 28px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); font-size: 12px; cursor: pointer; }

.toast { position: fixed; right: 40px; bottom: 40px; width: 360px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; background: var(--d-bg); color: var(--d-tx); border-radius: var(--r-lg); box-shadow: 0 8px 24px rgba(20,24,31,.2); }
.toast svg { width: 20px; height: 20px; stroke-width: 1.75; }
.toast b { font-weight: 600; } .toast p { margin: 2px 0 0; font-size: 13px; color: #ffe1e1; }
.toast button { height: 32px; padding: 0 14px; border-radius: var(--r-sm); border: 0; background: var(--surface); color: var(--d-bg); font-weight: 600; }
</style>
</head>
<body>
<aside class="rail">
  <div class="logo">라인</div>
  <a class="on" href="#"><i data-lucide="layout-dashboard"></i>대시보드</a>
  <a href="#"><i data-lucide="package"></i>생산</a>
  <a href="#"><i data-lucide="gauge"></i>가동률</a>
  <a href="#"><i data-lucide="activity"></i>예지보전</a>
  <a href="#"><i data-lucide="history"></i>알람이력</a>
  <a href="#"><i data-lucide="file-text"></i>리포트</a>
  <a href="#"><i data-lucide="settings"></i>설정</a>
  <a class="me" href="#"><i data-lucide="circle-user"></i>김현수</a>
</aside>

<div class="main">
  <header class="top">
    <h1>대시보드</h1>
    <div class="sum"><span>설비 39대</span><span>가동<b>34</b></span><span>정지<b>1</b></span><span>대기<b>2</b></span><span>고장<b style="color:var(--d-bg)">1</b></span></div>
    <div class="r"><span>${date}</span><button class="bell" aria-label="알림 5건"><i data-lucide="bell"></i><span>5</span></button></div>
  </header>

  <div class="content">
    <div class="col">
      <section class="panel board">
        <div class="ph" style="margin:12px 0 4px"><h2>공장 흐름</h2><span class="meta">위에서 아래로 · 행을 누르면 라인 상세</span>
          <div class="r"><div class="seg"><button class="on">2D</button><button>3D</button></div></div></div>
        <div id="board"></div>
      </section>
      <div class="lower">
        <section class="panel">
          <div class="ph"><h2>오늘 생산</h2><span class="meta">출고 양품 기준</span></div>
          <div class="figs"><div class="fig"><div class="l">목표</div><div class="v" id="pTarget"></div></div><div class="fig"><div class="l">실적</div><div class="v" id="pDone"></div></div><div class="fig"><div class="l">달성률</div><div class="v" id="pRate"></div></div></div>
          <div class="chart" id="chart"></div>
        </section>
        <section class="panel">
          <div class="ph"><h2>종합 가동률</h2><span class="meta">오늘</span></div>
          <div class="fig big"><div class="v" id="oee"></div></div>
          <div class="mini three" id="oeeMini"></div>
        </section>
        <section class="panel">
          <div class="ph"><h2>품질</h2><span class="meta">오늘</span></div>
          <div class="fig big"><div class="v" id="qRate"></div><div class="l" id="qSub"></div></div>
          <div class="mini" id="qMini"></div>
        </section>
      </div>
    </div>

    <section class="panel alerts">
      <div class="ph"><h2>알림</h2><span class="meta">오늘 9건 · 진행 중 5</span></div>
      <ul id="alerts"></ul>
    </section>
  </div>
</div>

<div class="toast" role="status">
  <i data-lucide="triangle-alert"></i>
  <div><b>L2 프레스 3단 고장</b><p>장비고장(알람) · 압력 상한 초과</p></div>
  <button>보기</button>
</div>

<script src="data.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
  document.querySelector('.top .r span').innerHTML = `${NOW.date}<b>${NOW.time}</b>`
  const arr = '<i data-lucide="chevron-right" class="arr"></i>'
  const chip = (s) => `<span class="chip s-${s}"><b>${s}</b>${STATUS[s]}</span>`
  const prog = (done, plan) => `<div class="prog"><div class="h"><span>실적 / 계획</span><span><b>${fmt(done)}</b> / ${fmt(plan)}</span></div><div class="t"><i style="width:${Math.min(100, (done / plan) * 100)}%"></i></div></div>`
  const c = (l, i) => cell(EQ_NAMES[i], l.st[i], { dur: l.dur?.[i], pdm: l.pdm?.[i] })
  const rows = [
    `<div class="b-row head"><span>구역</span><span>대표 상태</span><span>설비 흐름  슬리팅 → 프레스 1~4단 → 용접</span><span>오늘 생산</span><span class="n">OEE</span><span class="n">불량</span></div>`,
    `<div class="b-row shared"><div class="b-zone"><b>입고</b><span>공용</span></div><span></span><div class="flow txt">오늘 입고<b>${INBOUND.today}</b>코일 · 슬리팅 앞 재고<b>${INBOUND.stock}</b>롤</div><span></span><span class="n">-</span><span class="n">-</span></div>`,
    ...LINES.map((l) => `<div class="b-row"><div class="b-zone"><b>${l.id}</b></div>${chip(lineState(l.st))}
      <div class="flow">${c(l, 0)}${arr}${c(l, 1)}${c(l, 2)}${c(l, 3)}${c(l, 4)}${arr}${c(l, 5)}</div>
      ${prog(l.done, LINE_PLAN)}<span class="n">${l.oee.toFixed(1)}<small>%</small></span><span class="n">${l.ng}</span></div>`),
    `<div class="b-row"><div class="b-zone"><b>도장</b><span>L1~L6 합류</span></div>${chip('R')}<div class="flow">${PAINT.map((p) => cell(p.n, p.s)).join('')}</div>${prog(PAINT_LINE.done, PAINT_LINE.plan)}<span class="n">${PAINT_LINE.oee.toFixed(1)}<small>%</small></span><span class="n">${PAINT_LINE.ng}</span></div>`,
    `<div class="b-row shared"><div class="b-zone"><b>출고</b><span>공용</span></div>${chip(VISION.s)}<div class="flow">${cell(VISION.n, VISION.s)}<span class="txt">양품<b>${fmt(QUALITY.ok)}</b>· 불량<b>${QUALITY.ng}</b></span></div><span></span><span class="n">-</span><span class="n">${QUALITY.ng}</span></div>`,
  ]
  board.innerHTML = rows.join('')
  renderAlerts(alerts)
  pTarget.textContent = fmt(PROD.target); pDone.textContent = fmt(PROD.done); pRate.innerHTML = `${PROD.rate}<small>%</small>`
  oee.innerHTML = `${OEE.oee}<small>%</small>`
  oeeMini.innerHTML = [['시간가동률', OEE.a], ['성능가동률', OEE.p], ['양품률', OEE.q]].map(([l, v]) => `<div>${l}<b>${v.toFixed(1)}%</b></div>`).join('')
  qRate.innerHTML = `${QUALITY.rate}<small>% 출고 불량률</small>`; qSub.textContent = `양품 ${fmt(QUALITY.ok)} · 불량 ${QUALITY.ng}`
  qMini.innerHTML = QUALITY.byProc.map(([p, n]) => `<div>${p}<b>${n}</b></div>`).join('')
  chart.innerHTML = prodChart(chart)
  lucide.createIcons()
</script>
</body>
</html>
