<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 B · 라인 상세</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="b.css">
<link rel="stylesheet" href="b-detail.css">
<style>
/* 왼쪽 열 전체 = 라인 요약. 오른쪽 위 = 라인 흐름, 아래 가운데 = 시간대별 생산, 아래 오른쪽 = 알림 */
.lgrid { display: grid; grid-template-columns: clamp(300px, 18vw, 340px) minmax(0, 1fr) clamp(360px, 24vw, 440px); grid-template-rows: minmax(0, 1.8fr) minmax(0, 1fr); gap: var(--sp-4); min-height: 0; }
.lsum { grid-column: 1; grid-row: 1 / 3; }
.flowp { grid-column: 2 / 4; grid-row: 1; }
.chartp { grid-column: 2; grid-row: 2; }
.lgrid .alerts { grid-column: 3; grid-row: 2; }

/* 라인 요약: 세로 한 열을 다 쓰고, 덩어리 사이를 고르게 나눔 */
.lsum { justify-content: space-between; gap: var(--sp-4); }
.lsum .ph { margin-bottom: 0; }
.ls-state { display: flex; align-items: center; gap: var(--sp-3); }
.ls-state .key { width: 48px; height: 48px; font-size: var(--fs-2xl); border-radius: var(--r-md); }
.ls-state b { font-size: var(--fs-3xl); font-weight: 600; line-height: 1; }
.ls-state span { margin-left: auto; color: var(--text-3); font-size: var(--fs-sm); }
.ls-rsid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4) var(--sp-5); }
.ls-rsid li { display: flex; align-items: center; gap: var(--sp-2); color: var(--text-2); }
.ls-rsid .key { width: 28px; height: 28px; font-size: var(--fs-sm); }
.ls-rsid li b { margin-left: auto; color: var(--text); font-size: var(--fs-2xl); font-weight: 600; line-height: 1; }
.ls-rsid li.zero b { color: var(--text-3); font-weight: 400; }
.ls-fig { border-top: 1px solid var(--line); padding-top: var(--sp-5); }
.lsum .st-v { font-size: var(--fs-3xl); }
.ls-fig .st-l { font-size: var(--fs-sm); margin-bottom: var(--sp-1); }
.ls-fig .st-v small { margin-left: 4px; }
.ls-bar { height: 8px; margin-top: var(--sp-3); background: var(--surface-3); border-radius: 2px; }
.ls-bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.ls-list { list-style: none; margin: var(--sp-3) 0 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
.ls-list li { display: flex; justify-content: space-between; color: var(--text-2); }
.ls-list li b { color: var(--text); font-weight: 600; }

/* 라인 흐름 */
.flowwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: var(--sp-4) var(--sp-5); border: 1px solid var(--line); border-radius: var(--r-md); background-color: var(--surface); background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 24px 24px; background-position: -1px -1px; }
.flow { flex: 1; min-height: 0; align-content: center; display: grid; grid-template-columns: 64px minmax(0, 1fr) 80px minmax(0, 4.6fr) 80px minmax(0, 1fr) 64px; grid-template-rows: auto minmax(120px, 260px) auto; row-gap: var(--sp-2); }
.f-head { grid-row: 1; text-align: center; }
.f-head a { display: inline-flex; align-items: center; gap: 2px; font-weight: 600; text-decoration: none; background: var(--surface); padding: 0 4px; }
.f-head a:hover { text-decoration: underline; }
.f-head svg { width: 14px; height: 14px; color: var(--text-3); }
.f-grp { grid-row: 2; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--sp-3); position: relative; cursor: pointer; }
.f-link { grid-row: 2; position: relative; display: grid; place-items: center; }
.f-link::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1.5px solid var(--line-3); }
.f-link span { position: relative; background: var(--surface); padding: 2px 6px; color: var(--text-2); font-size: var(--fs-sm); text-align: center; line-height: 1.3; }
.f-link span b { display: block; color: var(--text); font-size: var(--fs-lg); }
.f-end { grid-row: 2; position: relative; display: grid; place-items: center; color: var(--text-3); font-size: var(--fs-xs); }
.f-end::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1.5px dashed var(--line-3); }
.f-end span { position: relative; background: var(--surface); padding: 0 4px; }
.f-foot { grid-row: 3; text-align: center; color: var(--text-2); font-size: var(--fs-sm); }
.f-foot b { color: var(--text); font-weight: 600; }

/* 라인 흐름 설비 칸: 이름 → 지금 사유나 사이클 → 상태·지속시간 */
.lc { min-width: 0; height: 100%; display: flex; flex-direction: column; padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); }
.lc-name { font-size: var(--fs-md); font-weight: 600; }
.lc-info { margin-top: var(--sp-2); display: grid; grid-template-columns: auto 1fr; gap: 2px var(--sp-3); font-size: var(--fs-sm); align-content: start; }
.lc-info dt { opacity: .8; } .lc-info dd { margin: 0; text-align: right; font-weight: 600; }
.lc-why { margin-top: var(--sp-2); font-size: var(--fs-sm); line-height: 1.35; }
.lc-why b { display: block; font-size: var(--fs-md); }
.lc-foot { margin-top: auto; display: flex; align-items: baseline; gap: var(--sp-2); padding-top: var(--sp-2); }
.lc-foot .c { font-size: var(--fs-2xl); font-weight: 700; line-height: 1; }
.lc-foot .d { margin-left: auto; font-size: var(--fs-md); font-weight: 600; }
.lc { container-type: inline-size; }
.lc-info dt, .lc-info dd, .lc-foot { white-space: nowrap; }
/* 창이 좁아 칸이 좁으면 항목을 세로로 쌓고 상태 단어는 숨김 (코드 글자는 남김) */
@container (max-width: 120px) {
  .lc-info { grid-template-columns: 1fr; gap: 0; }
  .lc-info dd { text-align: left; margin-bottom: 2px; }
  .lc-foot .w { display: none; }
}

.alerts .ph { margin-bottom: var(--sp-2); }
@media (max-height: 860px) {
  .flowwrap { padding: var(--sp-3) var(--sp-4); }
  .lsum { gap: var(--sp-2); } .ls-fig { padding-top: var(--sp-3); } .ls-state b, .lsum .st-v { font-size: var(--fs-2xl); } .ls-list { gap: 0; }
  .lc { padding: var(--sp-2) var(--sp-3); } .lc-foot .c { font-size: var(--fs-xl); }
  .lc-info, .lc-why { font-size: var(--fs-xs); }
}
</style>
</head>
<body>
<header class="top"></header>

<main class="page detail line">
  <div class="head">
    <nav class="crumb" aria-label="이동 경로"><a href="B.html">대시보드</a><i data-lucide="chevron-right"></i><b>L2</b></nav>
    <div class="tabs"><a href="#">L1</a><a class="on" href="#">L2</a><a href="#">L3</a><a href="#">L4</a><a href="#">L5</a><a href="#">L6</a><a href="B-paint.html">도장</a></div>
  </div>

  <div class="lgrid">
    <section class="panel lsum">
      <div class="ph"><h2>L2 지금</h2><span class="meta">설비 6대 · 오늘 누적</span></div>
      <div class="ls-state"><i class="key s-D">D</i><b>고장</b><span>라인 대표 상태</span></div>
      <ul class="ls-rsid">
        <li><i class="key s-R">R</i>가동<b>3</b></li>
        <li class="zero"><i class="key s-S">S</i>정지<b>0</b></li>
        <li><i class="key s-I">I</i>대기<b>2</b></li>
        <li><i class="key s-D">D</i>고장<b>1</b></li>
      </ul>
      <div class="ls-fig">
        <div class="st-l">오늘 라인 실적 / 라인 계획</div>
        <div class="st-v">108<small>/ 200</small></div>
        <div class="ls-bar" role="img" aria-label="달성률 54.0%"><i style="width:54%"></i></div>
        <div class="st-sub" style="margin-top:6px">달성률 54.0%</div>
      </div>
      <div class="ls-fig">
        <div class="st-l">라인 OEE</div>
        <div class="st-v">68.9<small>%</small></div>
      </div>
      <div class="ls-fig">
        <div class="st-l">오늘 불량 제외</div>
        <div class="st-v">7</div>
        <ul class="ls-list"><li>슬리팅<b>1</b></li><li>프레스 (4단 뒤 검사)<b>3</b></li><li>용접<b>3</b></li></ul>
      </div>
    </section>

    <section class="panel flowp">
      <div class="ph"><h2>라인 흐름</h2><span class="meta">공정 이름이나 설비 칸을 누르면 공정 상세</span>
        <div class="r legend"><span><i class="s-R">R</i>가동</span><span><i class="s-S">S</i>정지</span><span><i class="s-I">I</i>대기</span><span><i class="s-D">D</i>고장</span></div></div>
      <div class="flowwrap"><div class="flow" id="flow"></div></div>
    </section>

    <section class="panel chartp">
      <div class="ph"><h2>시간대별 라인 생산</h2><span class="meta">00시~24시 누적</span>
        <div class="r chleg"><span><i></i>라인 실적</span><span><i class="t"></i>라인 계획 200</span></div></div>
      <div class="fill" id="chart"></div>
    </section>
    <section class="panel alerts">
      <div class="ph"><h2>L2 오늘 알림</h2><span class="meta">3건 · 진행 중 3</span></div>
      <ul id="alerts"></ul>
    </section>
  </div>
</main>

<script src="data.js"></script>
<script src="b.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
  renderTop('대시보드')
  // 데모 값 (L2, 14:32:08). 사이클·CT는 프레스 상세 시안, 사유는 알림과 같은 값
  const L = LINES[1]
  const WORD = { R: '가동', S: '정지', I: '대기', D: '고장' }
  const EQ = [
    { n: '슬리팅', dur: '4:02:15', info: [['오늘 생산', '131']] },
    { n: '1단 성형', dur: '4:02:15', info: [['오늘 사이클', '124'], ['평균 CT', '548ms']] },
    { n: '2단 트림', dur: '4:02:15', note: '가장 느린 단', info: [['오늘 사이클', '122'], ['평균 CT', '582ms']] },
    { n: '3단 피어싱', dur: '11:56', why: ['장비고장(알람)', 'Pressure 1 상한 초과 (356 / 350)'], info: [['오늘 사이클', '119']] },
    { n: '4단 플랜지', dur: '11:28', why: ['재공부족', '앞 공정 정지'], info: [['오늘 사이클', '118']] },
    { n: '용접', dur: '11:03', why: ['재공부족', '앞 공정 정지'], info: [['오늘 생산', '115']] },
  ]
  const lc = (i) => {
    const e = EQ[i], s = L.st[i]
    return `<div class="lc s-${s}">
      <div class="lc-name">${e.n}</div>
      ${e.why ? `<div class="lc-why"><b>${e.why[0]}</b>${e.why[1]}</div>` : ''}
      ${e.note ? `<div class="lc-why">${e.note}</div>` : ''}
      <dl class="lc-info">${e.info.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
      <div class="lc-foot"><span class="c">${s}</span><span class="w">${WORD[s]}</span><span class="d">${e.dur}</span></div>
    </div>`
  }
  const head = (col, n, href) => `<div class="f-head" style="grid-column:${col}"><a href="${href}">${n}<i data-lucide="chevron-right"></i></a></div>`
  flow.innerHTML = `
    <div class="f-end" style="grid-column:1"><span>입고에서</span></div>
    ${head(2, '슬리팅', 'B-slit.html')}<div class="f-grp" style="grid-column:2" data-href="B-slit.html">${lc(0)}</div>
    <div class="f-link" style="grid-column:3"><span>재공<b>6</b></span></div>
    ${head(4, '프레스', 'B-press.html')}<div class="f-grp" style="grid-column:4" data-href="B-press.html">${[1, 2, 3, 4].map(lc).join('')}</div>
    <div class="f-link" style="grid-column:5"><span>재공<b>0</b></span></div>
    ${head(6, '용접', 'B-weld.html')}<div class="f-grp" style="grid-column:6" data-href="B-weld.html">${lc(5)}</div>
    <div class="f-end" style="grid-column:7"><span>도장으로</span></div>
    <div class="f-foot" style="grid-column:2">생산 <b>131</b> · 불량 1</div>
    <div class="f-foot" style="grid-column:4">생산 <b>118</b> · 불량 3 <span class="note2">(4단 뒤 검사)</span></div>
    <div class="f-foot" style="grid-column:6">생산 <b>115</b> · 불량 3</div>`
  flow.querySelectorAll('.f-grp').forEach((g) => g.addEventListener('click', () => location.href = g.dataset.href))

  // 누적 실적: 시간당 7~8개, 14:20 고장 뒤 멈춤
  const hourly = [8, 7, 8, 7, 8, 7, 8, 7, 8, 7, 8, 7, 8, 7, 3], pts = [[0, 0]]
  let cum = 0
  hourly.forEach((v, i) => pts.push([i === 14 ? 14 + 20 / 60 : i + 1, (cum += v)]))
  pts.push([14 + 32 / 60, cum])
  draw(chart, (el) => lineChart(el, { label: 'L2 시간대별 누적 실적과 라인 계획', x0: 0, x1: 24, xTicks: [0, 6, 12, 18, 24].map((h) => [h, `${String(h).padStart(2, '0')}시`]), y0: 0, y1: 200, yTicks: [0, 50, 100, 150, 200],
    series: [{ pts, cls: 'ch-actual' }, { pts: [[0, 0], [24, 200]], cls: 'ch-target' }], dot: true, now: 14 + 32 / 60 }))

  alerts.innerHTML = ALERTS.filter((a) => a.eq.startsWith('L2')).map((a) => `
    <li class="al ${a.on ? 'on' : 'off'}${a.on && a.s !== 'S' ? ' t-' + a.s : ''}" onclick="location.href='B-press.html'">
      <span class="al-code s-${a.s}">${a.s}</span>
      <div class="al-main"><div class="al-eq">${a.eq}</div><div class="al-msg">${a.code} · ${a.msg}</div></div>
      <div class="al-meta"><span>${a.t}</span><span class="al-dur">${a.dur}</span></div>
    </li>`).join('')
  lucide.createIcons()
</script>
</body>
</html>
