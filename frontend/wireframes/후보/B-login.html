<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 B · 로그인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="b.css">
<link rel="stylesheet" href="b-set.css">
<style>
body { display: grid; grid-template-rows: none; place-items: center; background-color: var(--bg); background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 24px 24px; }
.card { width: 400px; padding: 40px 36px 32px; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); display: flex; flex-direction: column; gap: var(--sp-4); }
.brand { display: flex; align-items: center; gap: 10px; font-size: var(--fs-xl); font-weight: 600; margin-bottom: var(--sp-1); }
.brand svg { width: 24px; height: 24px; stroke-width: 1.75; }
.sub { margin: 0 0 var(--sp-2); color: var(--text-2); }
.input { height: 44px; }
.err { display: flex; align-items: center; gap: var(--sp-2); color: var(--danger); font-size: var(--fs-sm); font-weight: 500; }
.err svg { width: 16px; height: 16px; flex: none; }
.btn.primary { height: 44px; font-size: var(--fs-md); font-weight: 600; margin-top: var(--sp-1); }
.foot { color: var(--text-3); font-size: var(--fs-xs); text-align: center; margin: var(--sp-2) 0 0; }
</style>
</head>
<body>
<form class="card" onsubmit="location.href='B.html'; return false">
  <div class="brand"><i data-lucide="factory"></i>라인가동현황</div>
  <p class="sub">공장 설비 39대의 지금 상태를 봅니다</p>
  <label class="field"><span>아이디</span><input class="input" value="hyunsoo.kim" autocomplete="username"></label>
  <label class="field"><span>비밀번호</span><input class="input" type="password" value="password" autocomplete="current-password" aria-describedby="err"></label>
  <div class="err" id="err" role="alert"><i data-lucide="circle-alert"></i>아이디 또는 비밀번호가 맞지 않습니다</div>
  <button class="btn primary">로그인</button>
  <p class="foot">계정은 관리자가 미리 등록합니다 · 로그인은 7일간 유지</p>
</form>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons()</script>
</body>
</html>
